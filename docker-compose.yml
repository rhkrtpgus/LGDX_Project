services:
  postgres:
    image: postgres:17-alpine
    container_name: lgdx-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lgdx}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-12345}
    ports:
      - "${POSTGRES_PORT:-3355}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-lgdx}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mongo:
    image: mongo:8
    container_name: lgdx-mongo
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand({ ping: 1 }).ok' | mongosh --quiet mongodb://localhost:27017/test | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  back:
    build:
      context: ./Back
      dockerfile: Dockerfile
    container_name: lgdx-back
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-lgdx}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-12345}
      MODEL_PYTHON_COMMAND: ${MODEL_PYTHON_COMMAND:-python}
    ports:
      - "${SPRING_PORT:-8082}:8082"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "java -version >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  fastapi:
    build:
      context: .
      dockerfile: FastAPI/Dockerfile
    container_name: lgdx-fastapi
    environment:
      APP_NAME: ${FASTAPI_APP_NAME:-LGDX FastAPI}
      APP_VERSION: ${FASTAPI_APP_VERSION:-0.1.0}
      APP_DEBUG: ${FASTAPI_APP_DEBUG:-false}
      API_PREFIX: ${FASTAPI_API_PREFIX:-/fastapi}
      CORS_ALLOW_ALL: ${CORS_ALLOW_ALL:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1}
      POSTGRES_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-12345}@postgres:5432/${POSTGRES_DB:-lgdx}
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DATABASE: ${MONGODB_DATABASE:-lgdx_monitor}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-900}
      ADDICTION_MONITOR_PYTHON_COMMAND: ${ADDICTION_MONITOR_PYTHON_COMMAND:-python}
      ADDICTION_MONITOR_MAX_SECONDS: ${ADDICTION_MONITOR_MAX_SECONDS:-5}
      ADDICTION_MONITOR_CAMERA_INDEX: ${ADDICTION_MONITOR_CAMERA_INDEX:-0}
    ports:
      - "${FASTAPI_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000${FASTAPI_API_PREFIX:-/fastapi}/system/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
      args:
        VITE_JAVA_API_BASE_URL: ${VITE_JAVA_API_BASE_URL:-/api}
        VITE_FASTAPI_API_BASE_URL: ${VITE_FASTAPI_API_BASE_URL:-/fastapi}
        VITE_JAVA_PROXY_TARGET: ${VITE_JAVA_PROXY_TARGET:-http://back:8082}
        VITE_FASTAPI_PROXY_TARGET: ${VITE_FASTAPI_PROXY_TARGET:-http://fastapi:8000}
    container_name: lgdx-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      back:
        condition: service_healthy
      fastapi:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
  mongo_data:
