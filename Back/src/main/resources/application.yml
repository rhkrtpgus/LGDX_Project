server:
  port: 8082

spring:
  application:
    name: lgdx-back
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:3355}/${DB_NAME:lgdx}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:12345}
  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:never}
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.example.demo.domain,com.example.demo.dto
  configuration:
    map-underscore-to-camel-case: true

model:
  python-command: ${MODEL_PYTHON_COMMAND:python}
  working-directory: ${MODEL_WORKING_DIRECTORY:..\Models}
  script-name: ${MODEL_SCRIPT_NAME:API.py}
  execution-timeout-seconds: ${MODEL_EXECUTION_TIMEOUT_SECONDS:600}
  addiction-script-name: ${MODEL_ADDICTION_SCRIPT_NAME:addiction.py}
  addiction-execution-timeout-seconds: ${MODEL_ADDICTION_TIMEOUT_SECONDS:60}
  fastapi-base-url: ${MODEL_FASTAPI_BASE_URL:http://host.docker.internal:8000/fastapi}
